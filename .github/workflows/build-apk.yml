name: Build and publish Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version to build, for example 1.0.0 (manual runs upload an artifact; pushing a v* tag publishes a release)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set version and repository for the app
        id: appvars
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.0.0 (optionally with a suffix). Got: $version" >&2
            exit 1
          fi
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "repo_owner=${GITHUB_REPOSITORY_OWNER}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Decode private release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "Missing repository secret ANDROID_KEYSTORE_BASE64. Add the four Android signing secrets before building." >&2
            exit 1
          fi
          mkdir -p app/signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/signing/release-keystore.jks
          test -s app/signing/release-keystore.jks

      - name: Build APK signed with your private keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_OWNER: ${{ steps.appvars.outputs.repo_owner }}
          GITHUB_REPO: ${{ steps.appvars.outputs.repo_name }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon clean assembleRelease \
            -PappVersionCode=${{ steps.appvars.outputs.version_code }} \
            -PappVersionName='${{ steps.appvars.outputs.version_name }}'

      - name: Name APK for GitHub Releases
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk Plain-Gauge-Calculator.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plain-Gauge-Calculator-APK
          path: Plain-Gauge-Calculator.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Plain Gauge Calculator v${{ steps.appvars.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: Plain-Gauge-Calculator.apk
